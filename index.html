<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Timer</title>
</head>
<body>
    <h1>Timer</h1>
    <form>
        <div>
            <input type="number" id="minute" min="0" max="60">
        </div>
        <div>
            <input type="number" id="second" min="0" max="60">
        </div>
    
        <p id="counter">00:00</p>
        <p id="launch"></p>
    
        <div>
            <input type="submit" id="submit" value="Submit">
        </div>
    </form>

    <footer>
        <p>Developed by <a href="https://github.com/estebancascardev" target="_blank">Esteban Castro</a></p>
        <p>Github repository <a href="https://github.com/estebancascardev/nasa-timer">Here</a></p>
    </footer>

    <script src="timer.js"></script>
</body>
</html>
